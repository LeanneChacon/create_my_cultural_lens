<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Cultural Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF5; --panel:#FFFFFF; --ink:#1C1F3A; --muted:#565B7A; --line:#CDD1E2;
  --btn:#26365F; --btn-ink:#FFFFFF; --chip:#F3F4F9; --focus:#3B6FE0;
  --dim:#26365F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#13152A; --panel:#1C1F37; --ink:#E9EAF4; --muted:#A3A7C4; --line:#343858;
    --btn:#CBD4F7; --btn-ink:#13152A; --chip:#252945; --focus:#8FB0FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13152A; --panel:#1C1F37; --ink:#E9EAF4; --muted:#A3A7C4; --line:#343858;
  --btn:#CBD4F7; --btn-ink:#13152A; --chip:#252945; --focus:#8FB0FF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:1.0625rem; line-height:1.55;
}
h1,h2,h3{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;line-height:1.1;margin:0}
.wrap{max-width:1140px;margin:0 auto;padding:clamp(16px,4vw,48px)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,5vw,64px);align-items:start}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);display:flex;flex-direction:column;align-items:center;gap:18px}
.lens-box{width:100%;max-width:470px;aspect-ratio:1;position:relative}
canvas{width:100%;height:100%;display:block}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;max-width:470px}
.legend button{
  font:inherit;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:999px;padding:3px 10px 3px 8px;display:inline-flex;align-items:center;gap:6px;cursor:pointer
}
.legend button .dot{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.25;border:1px solid var(--c)}
.legend button.done .dot{opacity:1}
.legend button.skipped .dot{background:transparent;opacity:.6}
.legend button.current{color:var(--ink);border-color:var(--ink)}
.panel{background:var(--panel);border-radius:22px;padding:clamp(22px,4vw,40px);border-top:6px solid var(--dim);transition:border-color .3s}
.title{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.02em;margin-bottom:.35em}
.step-meta{color:var(--muted);font-size:.9rem;margin:0 0 .6em}
.panel h2{font-size:clamp(1.7rem,3.6vw,2.3rem);font-weight:700;letter-spacing:-.01em;margin-bottom:.25em}
.panel p{margin:.5em 0;max-width:62ch}
.lead{color:var(--muted)}
.q{margin-top:1.5em}
.q-label{font-weight:700;display:block;margin-bottom:.55em}
.q-hint{color:var(--muted);font-size:.9rem;font-weight:400}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.opt{
  font:inherit;font-size:.95rem;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);
  border-radius:12px;padding:10px 12px;cursor:pointer;line-height:1.25;min-height:48px;text-align:left
}
.choices .opt{display:flex;align-items:center;gap:10px}
.choices .opt .dot{width:16px;height:16px;border-radius:50%;background:var(--c);flex:none;border:2px solid transparent}
.choices .opt[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--tc);font-weight:700}
.choices .opt[aria-pressed="true"] .dot{border-color:var(--tc)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale .opt{text-align:center;font-size:.9rem;padding:10px 4px}
.scale .opt[aria-pressed="true"]{background:var(--dim);border-color:var(--dim);color:var(--on-dim,#fff);font-weight:700}
input[type=text]{
  width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--chip);border:1.5px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-top:10px
}
.traits{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.nav{display:flex;gap:10px;align-items:center;margin-top:2em;flex-wrap:wrap}
.btn{
  font:inherit;font-weight:700;border-radius:999px;padding:12px 26px;cursor:pointer;border:1.5px solid var(--btn);
  background:var(--btn);color:var(--btn-ink);min-height:48px
}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:12px 8px;font-weight:400}
.spacer{flex:1}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.note{font-size:.88rem;color:var(--muted);margin-top:1.4em}
.swatch{
  display:flex;align-items:flex-end;justify-content:space-between;border-radius:16px;padding:18px 20px;
  min-height:120px;margin:1.2em 0;font-family:"Bricolage Grotesque",system-ui,sans-serif
}
.swatch .nm{font-size:1.5rem;font-weight:800}
.swatch .hx{font-size:1rem;opacity:.85}
.threads{list-style:none;padding:0;margin:.6em 0 0}
.threads li{padding:10px 0;border-top:1px solid var(--line)}
.threads li strong{display:block}
.threads .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.threads .pill{font-size:.85rem;border-radius:999px;padding:3px 10px;background:var(--c);color:var(--tc)}
.threads small{color:var(--muted)}
.prompts{padding-left:1.2em;margin:.5em 0}
.prompts li{margin:.45em 0}
.status{color:var(--muted);font-size:.9rem;min-height:1.4em}
h3{font-size:1.2rem;margin-top:1.6em}
.source{font-size:.8rem;color:var(--muted);text-align:center;margin-top:32px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .stage{position:static}
  .lens-box{max-width:min(340px,80vw)}
  .choices{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .scale .opt{font-size:.78rem}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="layout">
    <div class="stage" aria-label="Your lens so far">
      <div class="lens-box"><canvas id="lens" role="img" aria-label="Your cultural lens, drawn from your answers"></canvas></div>
      <div class="legend" id="legend"></div>
    </div>
    <main class="panel" id="panel" aria-live="polite"></main>
  </div>
  <p class="source">Dimensions adapted from Marilyn Loden and Judy Rosener, <i>Workforce America! Managing Employee Diversity as a Vital Resource</i> (1991). Language added as an additional dimension.</p>
</div>

<script>
// ---------- Data ----------
const SELF = "Self-describe";
const PNTS = "Prefer not to say";
const DIMS = [
  {id:"age", name:"Age", ring:0, color:"#6A9CD3", multi:false,
   q:"What is your age range?",
   opts:["Under 18","18 to 24","25 to 34","35 to 44","45 to 54","55 to 64","65 to 74","75 or older",PNTS]},
  {id:"race", name:"Race", ring:0, color:"#E07F3E", multi:true,
   q:"How do you identify racially?",
   opts:["American Indian or Alaska Native","Asian","Black or African American","Middle Eastern or North African","Native Hawaiian or Pacific Islander","White","Multiracial",SELF,PNTS]},
  {id:"ethnicity", name:"Ethnicity", ring:0, color:"#8E9BB8", multi:true,
   q:"Which heritages are part of you?",
   opts:["African","Caribbean","East Asian","South Asian","Southeast Asian","European","Hispanic or Latine","Indigenous","Jewish","Middle Eastern or North African","Pacific Islander",SELF,PNTS]},
  {id:"gender", name:"Gender", ring:0, color:"#F1BE3E", multi:true,
   q:"How do you describe your gender?",
   opts:["Woman","Man","Nonbinary","Genderqueer or genderfluid","Agender","Two-Spirit","Transgender","Questioning",SELF,PNTS]},
  {id:"ability", name:"(Dis)Abilities", ring:0, color:"#4D72C4", multi:true,
   q:"Which of these are part of your experience?",
   opts:["No disability I identify with","Physical or mobility","Vision or hearing","Neurodivergent (ADHD, autism, dyslexia, etc.)","Chronic illness or chronic pain","Mental health condition","Learning disability",SELF,PNTS]},
  {id:"sexual", name:"Sexual identity", ring:0, color:"#77AA4E", multi:true,
   q:"How do you describe your sexual identity?",
   opts:["Straight","Gay","Lesbian","Bisexual","Pansexual","Queer","Asexual or aromantic spectrum","Questioning",SELF,PNTS]},
  {id:"class", name:"Economic class (childhood)", ring:0, color:"#2E5B8C", multi:false,
   q:"Which best describes your household growing up?",
   opts:["Poverty or very low income","Working class","Lower middle class","Middle class","Upper middle class","Wealthy","It changed a lot","Not sure",PNTS]},
  {id:"religion", name:"Religion (childhood)", ring:0, color:"#904A20", multi:true,
   q:"What faith traditions were part of your home growing up?",
   opts:["None","Protestant Christian","Catholic","Orthodox Christian","Latter-day Saint","Muslim","Jewish","Hindu","Buddhist","Sikh","Indigenous or traditional spirituality","Spiritual, not religious",SELF,PNTS]},
  {id:"education", name:"Education", ring:1, color:"#2BA39A", multi:false,
   q:"What is the main path your education has taken?",
   opts:["Some high school","High school diploma or GED","Trade or vocational training","Some college","Associate degree","Bachelor's degree","Master's degree","Doctorate or professional degree","Self-taught or another path",PNTS]},
  {id:"income", name:"Income / economic status", ring:1, color:"#8C6BC8", multi:false,
   q:"How secure do you feel financially right now?",
   opts:["Struggling to meet basic needs","Getting by","Comfortable","Very comfortable","Wealthy",PNTS]},
  {id:"beliefs", name:"Religious beliefs (current)", ring:1, color:"#C9952B", multi:true,
   q:"What do you believe or practice now?",
   opts:["Atheist","Agnostic","Exploring","Spiritual, not religious","Protestant Christian","Catholic","Orthodox Christian","Latter-day Saint","Muslim","Jewish","Hindu","Buddhist","Sikh","Indigenous or traditional spirituality",SELF,PNTS]},
  {id:"relationship", name:"Relationship / parental status", ring:1, color:"#D2577F", multi:true,
   q:"Which describe your relationships and family right now?",
   opts:["Single","Dating","Partnered or married","Separated or divorced","Widowed","Parent of young children","Parent of adult children","Caregiver for a family member","No children","Hoping to have children",SELF,PNTS]},
  {id:"geography", name:"Geographic location", ring:1, color:"#3F7F4F", multi:true,
   q:"What kinds of places have shaped you?",
   opts:["Rural area","Small town","Suburb","City","Moved often","Grew up in another country","Live in another country now","Tribal or reservation land",SELF,PNTS]},
  {id:"language", name:"Language", ring:1, color:"#3FB5D9", multi:true,
   q:"What is your relationship with language?",
   extra:"Which languages do you speak, sign, or understand?",
   opts:["Speak one language","Bilingual","Multilingual (three or more)","The main language where I live is my first language","The main language where I live is not my first language","Use a sign language","Speak a regional dialect or strong accent","Switch how I speak between communities","Reconnecting with a heritage language","My family lost a language over generations",SELF,PNTS]},
  {id:"work", name:"Work background", ring:1, color:"#B8453A", multi:true,
   q:"Which fields make up your work background?",
   opts:["Education","Healthcare","Technology","Business or finance","Trades or manufacturing","Service, hospitality or retail","Arts or media","Government or public service","Military","Nonprofit or community work","Agriculture","Science or research","Caregiving or homemaking","Student",SELF,PNTS]}
];
const SCALE = ["Hardly at all","A little","Somewhat","A lot","Deeply"];
const TRAITS = [
  ["Curious","#2E9CCA"],["Calm","#6FA8A0"],["Bold","#D2433A"],["Warm","#E8964A"],
  ["Analytical","#3D5A99"],["Playful","#E5C230"],["Reserved","#7C7FA6"],["Driven","#A8322F"],
  ["Empathetic","#C76D9B"],["Creative","#8A55C2"],["Practical","#5E8C46"],["Spontaneous","#F07A5A"]
];

const blank = () => ({choices:[], other:"", extra:"", inf:null, skipped:false});
const state = { traits: [], answers: Object.fromEntries(DIMS.map(d => [d.id, blank()])) };
const STEPS = ["intro","personality", ...DIMS.map(d => d.id), "result"];
let step = 0;

// ---------- Color math (OKLab) ----------
function hexToRgb(h){h=h.replace("#","");return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255)}
const toLin = c => c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4);
const toSrgb = c => c<=0.0031308 ? 12.92*c : 1.055*Math.pow(c,1/2.4)-0.055;
function rgbToOklab([r,g,b]){
  r=toLin(r);g=toLin(g);b=toLin(b);
  const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b);
  const m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b);
  const s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
  return [0.2104542553*l+0.7936177850*m-0.0040720468*s,1.9779984951*l-2.4285922050*m+0.4505937099*s,0.0259040371*l+0.7827717662*m-0.8086757660*s];
}
function oklabToRgb([L,a,b]){
  const l=Math.pow(L+0.3963377774*a+0.2158037573*b,3);
  const m=Math.pow(L-0.1055613458*a-0.0638541728*b,3);
  const s=Math.pow(L-0.0894841775*a-1.2914855480*b,3);
  return [4.0767416621*l-3.3077115913*m+0.2309699292*s,-1.2684380046*l+2.6097574011*m-0.3413193965*s,-0.0041960863*l-0.7034186147*m+1.7076147010*s]
    .map(c=>Math.min(1,Math.max(0,toSrgb(c))));
}
const rgbToHex = rgb => "#"+rgb.map(c=>Math.round(c*255).toString(16).padStart(2,"0")).join("").toUpperCase();
const hexToLab = h => rgbToOklab(hexToRgb(h));
const labToHex = l => rgbToHex(oklabToRgb(l));
function shade(hex, dL=0, chromaMul=1, hueShift=0, minC=0){
  let [L,a,b]=hexToLab(hex);
  let C=Math.max(Math.hypot(a,b)*chromaMul,minC), H=Math.atan2(b,a)+hueShift;
  return labToHex([Math.min(0.95,Math.max(0.22,L+dL)),C*Math.cos(H),C*Math.sin(H)]);
}
const textOn = hex => hexToLab(hex)[0] > 0.68 ? "#1C1F3A" : "#FFFFFF";

// Every answer choice gets its own shade within its dimension's color family.
// Each option gets a color picked to be as different as possible from the others in its
// dimension (within that dimension's color family). Order follows the list, so no shade is
// meant to "stand for" a group.
const _palettes = {};
function dimPalette(d){
  if(_palettes[d.id]) return _palettes[d.id];
  const n = d.opts.filter(o=>o!==PNTS).length;
  const L0 = hexToLab(d.color)[0];
  const Lc = Math.min(0.7, Math.max(0.52, L0));
  const cands = [];
  for(let h=0;h<11;h++) for(const dl of [-0.2,-0.07,0.07,0.2]){
    const hex = shade(d.color, Lc+dl-L0, 1.25, (h/10-0.5)*2.1, 0.11);
    cands.push({hex, lab:hexToLab(hex)});
  }
  const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]);
  const baseLab = hexToLab(d.color);
  const first = cands.reduce((b,c)=>dist(c.lab,baseLab)<dist(b.lab,baseLab)?c:b);
  const picked=[first];
  while(picked.length<n){
    let best=null,bd=-1;
    for(const c of cands){ if(picked.includes(c)) continue;
      const md=Math.min(...picked.map(p=>dist(p.lab,c.lab))); if(md>bd){bd=md;best=c} }
    picked.push(best);
  }
  return (_palettes[d.id]=picked.map(p=>p.hex));
}
function optColor(d, opt){
  if(opt===PNTS) return shade(d.color, 0.18, 0.2);
  const list = d.opts.filter(o=>o!==PNTS);
  return dimPalette(d)[list.indexOf(opt)];
}

// ---------- Seeded randomness ----------
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

// ---------- Answer helpers ----------
const isPrivate = a => a.choices.includes(PNTS);
const hasColor = a => a.choices.some(c=>c!==PNTS);
const strength = a => (a.inf===null ? 2 : a.inf);
const label = (a,c) => c===SELF && a.other.trim() ? a.other.trim() : c;
function dimBlend(d){
  const a = state.answers[d.id];
  const cols = a.choices.filter(c=>c!==PNTS).map(c=>optColor(d,c));
  if(!cols.length) return isPrivate(a) ? optColor(d,PNTS) : d.color;
  const labs = cols.map(hexToLab);
  return labToHex([0,1,2].map(k=>labs.reduce((s,l)=>s+l[k],0)/labs.length));
}

// ---------- Lens drawing ----------
const canvas = document.getElementById("lens");
const ctx = canvas.getContext("2d");
function sizeCanvas(){
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = Math.round(r.width*dpr); canvas.height = Math.round(r.height*dpr);
  drawLens();
}
function sectorFor(dim){
  const ring = DIMS.filter(d=>d.ring===dim.ring);
  const i = ring.indexOf(dim), n = ring.length, span = Math.PI*2/n;
  return {start:-Math.PI/2 + i*span, span};
}
function isDark(){
  const t = document.documentElement.dataset.theme;
  return t==="dark" || (t!=="light" && matchMedia("(prefers-color-scheme: dark)").matches);
}
function drawLens(){
  const W = canvas.width; if(!W) return;
  const dark = isDark();
  ctx.clearRect(0,0,W,W);
  const cx=W/2, cy=W/2, R=W*0.47, r0=R*0.30, r1=R*0.66, r2=R;

  const base = ctx.createRadialGradient(cx,cy,r0,cx,cy,R);
  base.addColorStop(0, dark?"#22264A":"#FFFFFF");
  base.addColorStop(1, dark?"#191C36":"#DDE1EE");
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=base; ctx.fill();

  DIMS.forEach((d,di)=>{
    const a = state.answers[d.id];
    const {start,span} = sectorFor(d);
    const rin = d.ring===0 ? r0 : r1, rout = d.ring===0 ? r1 : r2;
    const gap = span*0.012;
    const wedge = ()=>{ctx.beginPath(); ctx.arc(cx,cy,rout,start+gap,start+span-gap); ctx.arc(cx,cy,rin,start+span-gap,start+gap,true); ctx.closePath();};

    if(!a.choices.length){
      ctx.beginPath(); ctx.arc(cx,cy,(rin+rout)/2,start+gap,start+span-gap);
      ctx.strokeStyle = d.color; ctx.globalAlpha = a.skipped ? .2 : .1;
      ctx.lineWidth = (rout-rin)*0.75; ctx.setLineDash(a.skipped?[W*0.006,W*0.012]:[]);
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;
      return;
    }
    if(!hasColor(a)){
      // private: a frosted band, present but unreadable
      wedge(); ctx.fillStyle = optColor(d,PNTS); ctx.globalAlpha = .55; ctx.fill();
      ctx.save(); wedge(); ctx.clip();
      ctx.strokeStyle = dark?"rgba(255,255,255,.25)":"rgba(255,255,255,.7)"; ctx.lineWidth=W*0.002; ctx.globalAlpha=1;
      for(let k=-W;k<W;k+=W*0.014){ctx.beginPath();ctx.moveTo(k,0);ctx.lineTo(k+W,W);ctx.stroke();}
      ctx.restore(); ctx.globalAlpha=1;
      return;
    }

    const t = (strength(a)+1)/5;
    const cols = a.choices.filter(c=>c!==PNTS).map(c=>optColor(d,c));
    const rand = rng(hashStr(d.id + a.choices.join("|") + a.inf));

    wedge(); ctx.fillStyle=dimBlend(d); ctx.globalAlpha=0.14+0.3*t; ctx.fill(); ctx.globalAlpha=1;

    const count = Math.round((span*180/Math.PI) * (1.3 + 2.2*t));
    for(let k=0;k<count;k++){
      const ang = start+gap + rand()*(span-2*gap);
      const col = shade(cols[k % cols.length], (rand()-.5)*0.04);
      const rs = rin + (rout-rin)*0.02*rand();
      const len = (rout-rin) * (0.3 + 0.68*t) * (0.55 + 0.45*rand());
      const re = Math.min(rout-(rout-rin)*0.02, rs+len);
      const bend = (rand()-.5)*span*0.35;
      const am = ang + bend;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(ang)*rs, cy+Math.sin(ang)*rs);
      ctx.quadraticCurveTo(cx+Math.cos(am)*(rs+re)/2, cy+Math.sin(am)*(rs+re)/2, cx+Math.cos(ang+bend*.4)*re, cy+Math.sin(ang+bend*.4)*re);
      ctx.strokeStyle=col; ctx.globalAlpha=0.5+0.48*t*rand();
      ctx.lineWidth = W*0.0036*(0.5+rand()*1.3); ctx.lineCap="round"; ctx.stroke();
    }
    ctx.globalAlpha=1;
  });

  ctx.beginPath(); ctx.arc(cx,cy,r1,0,Math.PI*2);
  ctx.strokeStyle = dark?"rgba(255,255,255,.18)":"rgba(255,255,255,.85)"; ctx.lineWidth=W*0.006; ctx.stroke();

  const pcols = state.traits.map(t=>TRAITS.find(x=>x[0]===t)[1]);
  const pg = ctx.createRadialGradient(cx-r0*.25,cy-r0*.25,r0*.05,cx,cy,r0);
  if(pcols.length){
    pcols.forEach((c,i)=>pg.addColorStop(i/pcols.length, shade(c, -0.05*i)));
    pg.addColorStop(1, shade(pcols[pcols.length-1],-0.25));
  } else { pg.addColorStop(0,"#3A4A7A"); pg.addColorStop(1,"#1F2A4F"); }
  ctx.beginPath(); ctx.arc(cx,cy,r0*0.94,0,Math.PI*2); ctx.fillStyle=pg; ctx.fill();
  ctx.lineWidth=W*0.008; ctx.strokeStyle=dark?"rgba(255,255,255,.25)":"rgba(255,255,255,.9)"; ctx.stroke();

  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.lineWidth=W*0.012; ctx.strokeStyle = sig ? sig.hex : (dark?"#3A3F66":"#B9BED3"); ctx.stroke();
  const hl = ctx.createRadialGradient(cx-R*.42,cy-R*.48,0,cx-R*.42,cy-R*.48,R*.6);
  hl.addColorStop(0,"rgba(255,255,255,.55)"); hl.addColorStop(1,"rgba(255,255,255,0)");
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=hl; ctx.fill();
}
let sig = null;

// ---------- Signature color + name ----------
function signature(){
  let wL=0,wa=0,wb=0,W=0,Csum=0;
  const add=(hex,w)=>{const [L,a,b]=hexToLab(hex);wL+=L*w;wa+=a*w;wb+=b*w;W+=w;Csum+=Math.hypot(a,b)*w};
  DIMS.forEach(d=>{
    const a=state.answers[d.id];
    if(!hasColor(a)) return;
    const w = Math.pow((strength(a)+1)/5,2);
    const cols = a.choices.filter(c=>c!==PNTS);
    cols.forEach(c=>add(optColor(d,c), w/cols.length));
  });
  state.traits.forEach(t=>add(TRAITS.find(x=>x[0]===t)[1],0.35));
  if(!W) return null;
  let L=wL/W,a=wa/W,b=wb/W; const C=Math.hypot(a,b), target=Math.max(C,(Csum/W)*0.75);
  if(C>0.0001){a*=target/C;b*=target/C}
  L=Math.min(0.74,Math.max(0.52,L));
  const hex = labToHex([L,a,b]);
  const H = (Math.atan2(b,a)*180/Math.PI+360)%360;
  const hues=[[20,"Ember"],[55,"Amber"],[100,"Sunlit"],[160,"Verdant"],[210,"Tidal"],[255,"Harbor"],[290,"Dusk"],[330,"Iris"],[360,"Bloom"]];
  const word = target<0.04 ? "Pearl" : hues.find(([h])=>H<h)[1];
  const nThreads = DIMS.reduce((s,d)=>s+state.answers[d.id].choices.filter(c=>c!==PNTS).length,0);
  const strong = DIMS.filter(d=>hasColor(state.answers[d.id]) && strength(state.answers[d.id])>=3).length;
  const form = strong>=6 || nThreads>=20 ? "Prism" : strong<=2 && nThreads<=12 ? "Beam" : "Mosaic";
  const formNote = form==="Prism" ? "Your lens holds many strong colors at once, so it splits the world into a wide spectrum."
    : form==="Beam" ? "Your lens focuses light through a smaller set of strong colors."
    : "Your lens is a mosaic of distinct pieces, each adding its own tint.";
  return {hex, name:`${word} ${form}`, formNote, nThreads};
}

// ---------- UI ----------
const panel = document.getElementById("panel");
const legend = document.getElementById("legend");

function renderLegend(){
  legend.innerHTML = "";
  DIMS.forEach(d=>{
    const a = state.answers[d.id];
    const b = document.createElement("button");
    b.type="button"; b.style.setProperty("--c", a.choices.length ? dimBlend(d) : d.color);
    b.className = (a.choices.length?"done ":"") + (a.skipped?"skipped ":"") + (STEPS[step]===d.id?"current":"");
    b.innerHTML = `<span class="dot"></span>${d.name.replace(/ \(.*\)/,"")}`;
    b.setAttribute("aria-label", `${d.name}: ${a.choices.length?a.choices.map(c=>label(a,c)).join(", "):a.skipped?"skipped":"not answered"}. Go to this question.`);
    b.onclick = ()=>{ if(step>0){ step = STEPS.indexOf(d.id); render(); } };
    legend.appendChild(b);
  });
}

function setDim(color){
  panel.style.setProperty("--dim", color);
  panel.style.setProperty("--on-dim", textOn(color));
}

function render(){
  const s = STEPS[step];
  sig = s==="result" ? signature() : null;
  if(s==="intro") renderIntro();
  else if(s==="personality") renderPersonality();
  else if(s==="result") renderResult();
  else renderDim(DIMS.find(d=>d.id===s));
  renderLegend(); drawLens();
  const h = panel.querySelector("h1,h2"); if(h && step>0){h.setAttribute("tabindex","-1"); h.focus({preventScroll:true});}
  if(window.innerWidth<=820 && step>0) panel.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"});
}

function renderIntro(){
  setDim("#26365F");
  panel.innerHTML = `
    <h1 class="title">Who are you?</h1>
    <p>Everyone sees the world through a lens shaped by many parts of who they are: age, race, gender, where they grew up, the work they do, and more.</p>
    <p class="lead">For each of 15 dimensions, choose the answers that describe you. Every answer has its own color, and together they tint your lens. You can also say how strongly each dimension shapes you, which makes its colors bolder or softer.</p>
    <p class="lead">Choose "${PNTS}" or skip anything you'd rather not share. Those show up in your lens too, as frosted or open spaces.</p>
    <div class="nav"><button class="btn" id="go">Start building my lens</button></div>
    <p class="note">Nothing you choose is saved or sent anywhere. Your answers disappear when you close this page.</p>`;
  panel.querySelector("#go").onclick = ()=>{step=1;render()};
}

function renderPersonality(){
  setDim("#26365F");
  panel.innerHTML = `
    <p class="step-meta">The center of the wheel</p>
    <h2>Personality</h2>
    <p class="lead">Personality sits at the center of every lens. Pick up to three words that describe you.</p>
    <div class="q"><div class="choices traits" role="group" aria-label="Personality words">
      ${TRAITS.map(([t,c])=>`<button type="button" class="opt" data-t="${t}" style="--c:${c};--tc:${textOn(c)}" aria-pressed="${state.traits.includes(t)}"><span class="dot"></span>${t}</button>`).join("")}
    </div><p class="status" id="tstatus"></p></div>
    ${navHtml(false)}`;
  panel.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t, i=state.traits.indexOf(t);
    const st=panel.querySelector("#tstatus");
    if(i>=0) state.traits.splice(i,1);
    else if(state.traits.length<3) state.traits.push(t);
    else { st.textContent="You can pick up to three. Deselect one to choose another."; return; }
    st.textContent="";
    panel.querySelectorAll("[data-t]").forEach(x=>x.setAttribute("aria-pressed",state.traits.includes(x.dataset.t)));
    drawLens();
  });
  wireNav();
}

function renderDim(d){
  const a = state.answers[d.id];
  const idx = DIMS.indexOf(d);
  setDim(d.color);
  panel.innerHTML = `
    <p class="step-meta">${d.ring===0?"Core dimension":"Outer dimension"}, ${idx+1} of ${DIMS.length}</p>
    <h2>${d.name}</h2>
    <div class="q">
      <span class="q-label" id="ch-l">${d.q} <span class="q-hint">${d.multi?"Choose all that apply":"Choose one"}</span></span>
      <div class="choices" role="group" aria-labelledby="ch-l">
        ${d.opts.map((o,i)=>{const c=optColor(d,o);return `<button type="button" class="opt" data-i="${i}" style="--c:${c};--tc:${textOn(c)}" aria-pressed="${a.choices.includes(o)}"><span class="dot"></span>${o}</button>`}).join("")}
      </div>
      <div id="otherWrap" ${a.choices.includes(SELF)?"":"hidden"}>
        <label class="q-hint" for="other" style="display:block;margin-top:10px">Describe it in your own words</label>
        <input type="text" id="other" value="${escapeHtml(a.other)}" autocomplete="off">
      </div>
      ${d.extra?`<label class="q-hint" for="extra" style="display:block;margin-top:14px">${d.extra} (optional)</label><input type="text" id="extra" value="${escapeHtml(a.extra)}" autocomplete="off">`:""}
    </div>
    <div class="q">
      <span class="q-label" id="inf-l">How much does this shape the way you see the world? <span class="q-hint">Optional</span></span>
      <div class="scale" role="group" aria-labelledby="inf-l">
        ${SCALE.map((s,i)=>`<button type="button" class="opt" data-inf="${i}" aria-pressed="${a.inf===i}">${s}</button>`).join("")}
      </div>
    </div>
    ${navHtml(true)}`;

  const refreshChoices = ()=>{
    panel.querySelectorAll("[data-i]").forEach(x=>x.setAttribute("aria-pressed",a.choices.includes(d.opts[+x.dataset.i])));
    panel.querySelector("#otherWrap").hidden = !a.choices.includes(SELF);
    renderLegend(); drawLens();
  };
  panel.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
    const o = d.opts[+b.dataset.i];
    const has = a.choices.includes(o);
    if(!d.multi || o===PNTS) a.choices = has ? [] : [o];
    else if(has) a.choices = a.choices.filter(c=>c!==o);
    else a.choices = a.choices.filter(c=>c!==PNTS).concat(o);
    a.skipped = false;
    refreshChoices();
    if(o===SELF && a.choices.includes(SELF)) panel.querySelector("#other").focus();
  });
  panel.querySelector("#other").oninput = e=>{a.other=e.target.value};
  const ex = panel.querySelector("#extra"); if(ex) ex.oninput = e=>{a.extra=e.target.value};
  panel.querySelectorAll("[data-inf]").forEach(b=>b.onclick=()=>{
    const v=+b.dataset.inf; a.inf = a.inf===v ? null : v;
    panel.querySelectorAll("[data-inf]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.inf===a.inf));
    drawLens();
  });
  wireNav(d);
}

function navHtml(skippable){
  const last = step===STEPS.length-2;
  return `<div class="nav">
    <button type="button" class="btn ghost" id="back">Back</button>
    <span class="spacer"></span>
    ${skippable?`<button type="button" class="btn link" id="skip">Skip this one</button>`:""}
    <button type="button" class="btn" id="next">${last?"See my lens":"Next"}</button>
  </div>`;
}
function wireNav(d){
  panel.querySelector("#back").onclick=()=>{step--;render()};
  panel.querySelector("#next").onclick=()=>{step++;render()};
  const sk=panel.querySelector("#skip");
  if(sk) sk.onclick=()=>{state.answers[d.id]={...blank(), skipped:true}; step++; render()};
}

function renderResult(){
  const colored = DIMS.filter(d=>hasColor(state.answers[d.id]));
  if(!sig){
    setDim("#26365F");
    panel.innerHTML = `<h2>Your lens is still clear</h2>
      <p class="lead">There are no answers yet, so there's no color to show. Go back and choose an answer for at least one dimension to see your lens take shape.</p>
      <div class="nav"><button class="btn" id="restart2">Go to the first question</button></div>`;
    panel.querySelector("#restart2").onclick=()=>{step=1;render()};
    return;
  }
  setDim(sig.hex);
  const ordered = [...colored].sort((x,y)=>strength(state.answers[y.id])-strength(state.answers[x.id]));
  const top = ordered.slice(0,3);
  const prompts = top.map(d=>`How has your ${d.name.toLowerCase().replace(/ \(.*\)/,"")} shaped your experiences, values, and the way you act?`);
  prompts.push("Which parts of your lens do other people notice first? Which do they tend to miss?");
  prompts.push("Where might your lens make it easy to understand someone else, and where might it blur their view?");
  const privateN = DIMS.filter(d=>isPrivate(state.answers[d.id])).length;
  const openN = DIMS.filter(d=>!state.answers[d.id].choices.length).length;

  panel.innerHTML = `
    <p class="step-meta">Your cultural lens</p>
    <h2>${sig.name}</h2>
    <div class="swatch" style="background:${sig.hex};color:${textOn(sig.hex)}">
      <span class="nm">${sig.name}</span><span class="hx">${sig.hex}</span>
    </div>
    <p>${sig.formNote} It's made of ${sig.nThreads} colored thread${sig.nThreads===1?"":"s"}, one for each answer you chose${state.traits.length?`, around a center of ${state.traits.join(", ").toLowerCase()}`:""}.</p>
    ${(privateN||openN)?`<p class="note">${privateN?`${privateN} dimension${privateN>1?"s are":" is"} frosted because you kept ${privateN>1?"them":"it"} private. `:""}${openN?`${openN} ${openN>1?"are":"is"} left open. `:""}Those spaces are part of your picture too.</p>`:""}
    <h3>Your colors</h3>
    <ul class="threads">${ordered.map(d=>{const a=state.answers[d.id];
      return `<li><strong>${d.name}</strong>${a.inf!==null?`<small>Shapes me: ${SCALE[a.inf].toLowerCase()}</small>`:""}
        <div class="pills">${a.choices.filter(c=>c!==PNTS).map(c=>{const col=optColor(d,c);return `<span class="pill" style="--c:${col};--tc:${textOn(col)}">${escapeHtml(label(a,c))}</span>`}).join("")}</div>${a.extra.trim()?`<small>${escapeHtml(a.extra.trim())}</small>`:""}</li>`}).join("")}</ul>
    <h3>Questions to sit with</h3>
    <ol class="prompts">${prompts.map(p=>`<li>${p}</li>`).join("")}</ol>
    <div class="nav">
      <button type="button" class="btn" id="copy">Copy my summary</button>
      <button type="button" class="btn ghost" id="edit">Change answers</button>
      <span class="spacer"></span>
      <button type="button" class="btn link" id="restart">Start over</button>
    </div>
    <p class="status" id="cstatus" role="status"></p>`;
  panel.querySelector("#edit").onclick=()=>{step=1;render()};
  panel.querySelector("#restart").onclick=()=>{
    state.traits=[]; DIMS.forEach(d=>state.answers[d.id]=blank()); step=0; render();
  };
  panel.querySelector("#copy").onclick=async()=>{
    const lines=[`My cultural lens: ${sig.name} (${sig.hex})`];
    if(state.traits.length) lines.push(`Personality: ${state.traits.join(", ")}`);
    lines.push("");
    DIMS.forEach(d=>{const a=state.answers[d.id];
      lines.push(`${d.name}: ${a.choices.length?a.choices.map(c=>label(a,c)).join(", "):a.skipped?"skipped":"not answered"}${a.inf!==null?` (shapes me: ${SCALE[a.inf].toLowerCase()})`:""}${a.extra.trim()?` [${a.extra.trim()}]`:""}`)});
    const st=panel.querySelector("#cstatus");
    try{ await navigator.clipboard.writeText(lines.join("\n")); st.textContent="Copied your summary to the clipboard."; }
    catch(e){ st.textContent="Your browser blocked copying. Select the text on this page and copy it instead."; }
  };
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

window.addEventListener("resize", sizeCanvas);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", drawLens);
render(); sizeCanvas();
</script>
</body>
</html>
